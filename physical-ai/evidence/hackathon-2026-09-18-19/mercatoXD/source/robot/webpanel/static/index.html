<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A1X panel</title>
<style>
  :root {
    --bg: #14161a; --card: #1c1f26; --line: #2c313b; --fg: #e6e8ec;
    --dim: #8b93a1; --ok: #3ddc84; --warn: #ffb347; --bad: #ff5f56;
    --agent: #7aa2ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.45 ui-sans-serif, system-ui, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .pill {
    font-size: 12px; padding: 2px 9px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim);
  }
  .pill.on { color: var(--ok); border-color: var(--ok); }
  .pill.off { color: var(--bad); border-color: var(--bad); }
  .pill.busy { color: var(--warn); border-color: var(--warn); }
  main { flex: 1; display: flex; min-height: 0; }
  #video {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: #0d0f12; min-width: 0;
  }
  #video img { max-width: 100%; max-height: 100%; }
  aside {
    width: 380px; border-left: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  #log { flex: 1; overflow-y: auto; padding: 10px; }
  .msg { margin-bottom: 10px; }
  .msg .who { font-size: 11px; color: var(--dim); text-transform: uppercase; }
  .msg .body { white-space: pre-wrap; word-wrap: break-word; }
  .msg.agent .who { color: var(--agent); }
  .msg.status .body, .msg.log .body { color: var(--dim); font-size: 13px; }
  .msg.alert .body { color: var(--warn); }
  .msg img { max-width: 100%; border-radius: 6px; margin-top: 6px; }
  form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
  input[type=text] {
    flex: 1; background: var(--card); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
  }
  button {
    background: var(--card); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--dim); }
  button.danger { color: var(--bad); border-color: var(--bad); }
  footer { border-top: 1px solid var(--line); padding: 8px 14px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .controls label { color: var(--dim); font-size: 13px; }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--dim); font-size: 13px; }
  table { border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
  td, th { padding: 2px 10px 2px 0; text-align: right; font-size: 13px; }
  th { color: var(--dim); font-weight: 500; }
  td.name { text-align: left; color: var(--dim); }
  .bar { width: 130px; height: 6px; background: var(--line); border-radius: 3px; position: relative; }
  .bar i { position: absolute; top: -2px; width: 2px; height: 10px; background: var(--ok); }
  #detail { color: var(--dim); font-size: 12px; margin-left: auto; }
</style>
</head>
<body>
<header>
  <h1>A1X panel</h1>
  <span class="pill" id="p-can">CAN</span>
  <span class="pill" id="p-engaged">disengaged</span>
  <span class="pill" id="p-via"></span>
  <span class="pill" id="p-ws">ws</span>
  <span id="detail"></span>
</header>

<main>
  <div id="video"><img id="cam" alt="robot camera"></div>
  <aside>
    <div id="log"></div>
    <form id="chat-form" autocomplete="off">
      <input type="text" id="chat-input" placeholder="talk to the agent…">
      <button type="submit">Send</button>
    </form>
  </aside>
</main>

<footer>
  <div class="controls">
    <button id="btn-engage">Engage</button>
    <button id="btn-disengage">Disengage</button>
    <button id="btn-enable">Enable FF 1→5→6</button>
    <button id="btn-stop" class="danger">STOP</button>
    <label><input type="checkbox" id="agent-control" checked> agent may move the arm</label>
  </div>
  <div class="controls" style="margin-top:8px">
    <span class="pill" id="p-grip">gripper ?</span>
    <button id="btn-grip-probe">Probe gripper</button>
    <button id="btn-grip-open">Open</button>
    <button id="btn-grip-close">Close</button>
    <input type="range" id="grip-slider" min="-2" max="0.6" step="0.05" value="-2"
           style="flex:1;min-width:160px">
    <span id="grip-detail"></span>
  </div>

  <details open>
    <summary>joints</summary>
    <table id="joints">
      <thead><tr><th class="name">joint</th><th>q (deg)</th><th>goal</th><th>effort</th><th></th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </details>
</footer>

<script>
const JOG_DEG = 5;
const GRIP_OPEN = -2.0;
const GRIP_CLOSED = 0.6;
const N = 6;
const cam = document.getElementById("cam");
const logEl = document.getElementById("log");
const detail = document.getElementById("detail");
let ws = null;

cam.src = "/stream/robot";
cam.onerror = () => setTimeout(() => { cam.src = "/stream/robot?" + Date.now(); }, 2000);

function pill(id, text, cls) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = "pill" + (cls ? " " + cls : "");
}

function deg(rad) { return (rad * 180 / Math.PI).toFixed(1); }

function buildRows(state) {
  const body = document.querySelector("#joints tbody");
  if (body.children.length === N) return;
  body.innerHTML = "";
  for (let i = 0; i < N; i++) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="name">J${i + 1}</td><td class="q">–</td>` +
      `<td class="goal">–</td><td class="eff">–</td>` +
      `<td><div class="bar"><i></i></div></td>` +
      `<td><button data-j="${i}" data-d="-1">−</button> ` +
      `<button data-j="${i}" data-d="1">+</button></td>`;
    body.appendChild(tr);
  }
  body.querySelectorAll("button").forEach(b => {
    b.onclick = () => send({cmd: "jog", joint: +b.dataset.j,
                            delta_deg: +b.dataset.d * JOG_DEG});
  });
}

function renderState(s) {
  pill("p-can", s.connected ? (s.feedback_fresh ? "CAN live" : "CAN stale")
                            : "CAN down",
       s.connected && s.feedback_fresh ? "on" : "off");
  pill("p-engaged", s.engaged ? (s.moving ? "moving" : "engaged") : "disengaged",
       s.engaged ? (s.moving ? "busy" : "on") : "");
  pill("p-via", s.engaged ? "held by " + s.engaged_via : "");
  detail.textContent = s.status + " · tx " + s.tx;
  document.getElementById("agent-control").checked = !!s.agent_control;

  renderGrip(s.grip);

  buildRows(s);
  const rows = document.querySelectorAll("#joints tbody tr");
  for (let i = 0; i < N; i++) {
    const r = rows[i];
    r.querySelector(".q").textContent = s.q ? deg(s.q[i]) : "–";
    r.querySelector(".goal").textContent = s.engaged ? deg(s.goal[i]) : "–";
    r.querySelector(".eff").textContent = s.effort ? s.effort[i].toFixed(2) : "–";
    const lo = s.limits.lower[i], hi = s.limits.upper[i];
    const frac = s.q ? Math.min(1, Math.max(0, (s.q[i] - lo) / (hi - lo))) : 0;
    r.querySelector(".bar i").style.left = (frac * 100) + "%";
  }
}

function renderGrip(g) {
  if (!g) return;
  // alive is null until someone probes: 0x051 can be deaf while the arm is fine.
  const state = g.alive === null ? "?" : g.alive ? "alive" : "DEAD";
  pill("p-grip", "gripper " + state,
       g.alive === null ? "" : g.alive ? "on" : "off");
  const m = g.measured === null || g.measured === undefined ? "–" : g.measured.toFixed(2);
  document.getElementById("grip-detail").textContent =
    `pos ${m} · cel ${g.goal.toFixed(2)} · ${g.on ? "sterowany" : "bez TX"}`;
}

function addEvent(ev) {
  const div = document.createElement("div");
  div.className = "msg " + (ev.from === "operator" ? "me" : ev.kind === "chat" ? "agent" : ev.kind);
  const when = new Date(ev.t * 1000).toLocaleTimeString();
  div.innerHTML = `<div class="who"></div><div class="body"></div>`;
  div.querySelector(".who").textContent = `${ev.from} · ${when}`;
  div.querySelector(".body").textContent = ev.text;
  if (ev.image) {
    const img = document.createElement("img");
    img.src = ev.image;
    div.appendChild(img);
  }
  const atBottom = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 40;
  logEl.appendChild(div);
  if (atBottom) logEl.scrollTop = logEl.scrollHeight;
}

function send(msg) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => pill("p-ws", "ws up", "on");
  ws.onclose = () => { pill("p-ws", "ws down", "off"); setTimeout(connect, 1500); };
  ws.onmessage = (m) => {
    const data = JSON.parse(m.data);
    if (data.type === "state") renderState(data);
    else if (data.type === "event") addEvent(data);
    else if (data.type === "result" && !data.ok)
      addEvent({from: "panel", kind: "status", text: `${data.cmd}: ${data.detail}`,
                t: Date.now() / 1000});
  };
}

document.getElementById("chat-form").onsubmit = (e) => {
  e.preventDefault();
  const input = document.getElementById("chat-input");
  const text = input.value.trim();
  if (!text) return;
  send({cmd: "chat", text});
  input.value = "";
};
document.getElementById("btn-engage").onclick = () => send({cmd: "engage"});
document.getElementById("btn-disengage").onclick = () => send({cmd: "disengage"});
document.getElementById("btn-enable").onclick = () => {
  if (confirm("Run the FF 1→5→6 enable sequence? Motors briefly release.")) send({cmd: "enable"});
};
document.getElementById("btn-stop").onclick = () => send({cmd: "stop"});
document.getElementById("agent-control").onchange = (e) =>
  send({cmd: "agent_control", value: e.target.checked});

const gripSlider = document.getElementById("grip-slider");
document.getElementById("btn-grip-probe").onclick = () => send({cmd: "grip_probe"});
document.getElementById("btn-grip-open").onclick = () => {
  gripSlider.value = GRIP_OPEN; send({cmd: "grip", value: GRIP_OPEN});
};
document.getElementById("btn-grip-close").onclick = () => {
  gripSlider.value = GRIP_CLOSED; send({cmd: "grip", value: GRIP_CLOSED});
};
gripSlider.oninput = () => send({cmd: "grip", value: +gripSlider.value});

fetch("/api/events?since=0").then(r => r.json())
  .then(b => (b.events || []).forEach(addEvent)).catch(() => {});
connect();
</script>
</body>
</html>
